<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
    <defs>
        <style type="text/css">
        @keyframes am-weather-cloud-2 {
            0%, 100% { transform: translate(0px, 0px); }
            50% { transform: translate(2px, 0px); }
        }
        .am-weather-cloud-2 {
            animation: am-weather-cloud-2 3s linear infinite;
        }

        @keyframes am-weather-snow-soft-1 {
            0% { transform: translate(0, 0); opacity: 0; }
            20% { opacity: 0.9; }
            80% { opacity: 0.9; }
            100% { transform: translate(-1.5px, 8px); opacity: 0; }
        }

        @keyframes am-weather-snow-soft-2 {
            0% { transform: translate(0, 0); opacity: 0; }
            25% { opacity: 1; }
            75% { opacity: 1; }
            100% { transform: translate(1.8px, 9px); opacity: 0; }
        }

        @keyframes am-weather-snow-soft-3 {
            0% { transform: translate(0, 0); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translate(-0.8px, 7px); opacity: 0; }
        }

        .am-flk-1 { animation: am-weather-snow-soft-1 2.5s linear infinite; }
        .am-flk-2 { animation: am-weather-snow-soft-2 3.1s linear infinite; }
        .am-flk-3 { animation: am-weather-snow-soft-3 2.8s linear infinite; }
        .am-flk-4 { animation: am-weather-snow-soft-1 3.4s linear infinite; }
        .am-flk-5 { animation: am-weather-snow-soft-2 2.7s linear infinite; }
        .am-flk-6 { animation: am-weather-snow-soft-3 2.2s linear infinite; }
        .am-flk-7 { animation: am-weather-snow-soft-1 3.8s linear infinite; }
        .am-flk-8 { animation: am-weather-snow-soft-2 2.4s linear infinite; }

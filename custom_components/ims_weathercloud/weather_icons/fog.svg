                <path d="m24.58,25.47 l-17.07,0 c-0.36,0 -0.65,0.45 -0.65,1.04 c0,0.56 0.29,1.02 0.65,1.02 l17.07,0 c0.36,0 0.65,-0.45 0.65,-1.02 c0,-0.58 -0.29,-1.04 -0.65,-1.04z" fill="#57A0EE" stroke="white" stroke-linejoin="round" stroke-width="1.2" />
            </g>
        </g>
        <g transform="translate(0, 11)">
            <g class="fog-2">
                <path d="m24.58,25.47 l-17.07,0 c-0.36,0 -0.65,0.45 -0.65,1.04 c0,0.56 0.29,1.02 0.65,1.02 l17.07,0 c0.36,0 0.65,-0.45 0.65,-1.02 c0,-0.58 -0.29,-1.04 -0.65,-1.04z" fill="#57A0EE" stroke="white" stroke-linejoin="round" stroke-width="1.2" />

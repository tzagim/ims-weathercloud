<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
    <defs>
        <style type="text/css">
            @keyframes am-weather-cloud {
                0%, 100% { transform: translate(2px,0px); }
                50% { transform: translate(5px,0px); }
            }
            .am-weather-cloud {
                animation: am-weather-cloud 5s linear infinite;
            }
            .fog-1 {
                animation: fog-1-anim 4.8s linear infinite;
            }
            @keyframes fog-1-anim {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(3px); }
                75% { transform: translateX(-3px); }
            }

            .fog-2 {
                animation: fog-2-anim 4.8s linear infinite;
            }
            @keyframes fog-2-anim {
                0%, 100% { transform: translateX(0); }
                50% { transform: translateX(3px); }
            }
        </style>
    </defs>
    
    <g transform="translate(5, -5)" id="fog">
